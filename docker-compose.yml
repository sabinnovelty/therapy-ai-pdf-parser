services:
  therapy-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: therapy-ai
    ports:
      - '${PORT:-8000}:${PORT:-8000}'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=${PORT:-8000}
      - LLAMA_API_KEY=${LLAMA_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - STORAGE_TYPE=${STORAGE_TYPE}
    env_file:
      - .env
    volumes:
      - ./app:/app/app # Mount for development hot-reload
      - ./requirements.txt:/app/requirements.txt # Mount so new packages install on restart (no rebuild)
      - ./storage:/app/storage # Persist vector DB and uploads
    command: uvicorn app.app:app --host 0.0.0.0 --port ${PORT:-8000} --reload
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'python -c "import httpx; httpx.get(''http://localhost:$${PORT:-8000}/health'')"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  therapy-ai-client:
    build:
      context: ../therapi-ai-client
      dockerfile: Dockerfile.dev
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: therapy-ai-client
    ports:
      - '5173:5173'
    volumes:
      # Mount source so edits on your machine trigger hot reload
      - ../therapi-ai-client:/app
      # Keep container node_modules (don't overwrite with host)
      - therapy_client_node_modules:/app/node_modules
    depends_on:
      - therapy-ai
    restart: unless-stopped

  mongo:
    image: mongo
    restart: always
    ports:
      - '27017:27017' # Expose for MongoDB Compass / local tools
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db/
  valkey:
    image: valkey/valkey:latest
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data
  worker:
    command:
      ['/bin/sh', '-c', 'rq worker --with-scheduler --url redis://valkey:6379']
    build:
      dockerfile: Dockerfile
      context: .
    env_file:
      - ./.env
    volumes:
      - ./app:/app/app
      - ./requirements.txt:/app/requirements.txt
      - ./storage:/app/storage
  rq-dashboard:
    image: eoranged/rq-dashboard:latest
    ports:
      - '9181:9181'
    environment:
      - RQ_DASHBOARD_REDIS_URL=redis://valkey:6379
    depends_on:
      - worker

volumes:
  mongodb_data:
  valkey_data:
  therapy_client_node_modules:
